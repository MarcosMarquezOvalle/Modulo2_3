[project]
name = "modulo2-3"
version = "0.1.0"
description = "Orders API with JWT auth, SQLModel SQLite persistence, and validation"
authors = [
    {name = "MarcosMarquezOvalle",email = "mmarquez17@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "PyJWT>=2.8.0",
    "sqlmodel>=0.0.8",
    "sqlalchemy>=2.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/modulo2_3"]

[tool.coverage.report]
show_missing = true

[tool.poetry]
packages = [{include = "modulo2_3", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
